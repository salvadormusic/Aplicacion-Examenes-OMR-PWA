<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes tipo test</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#2c5d8f;color:#fff;padding:12px;position:sticky;top:0;z-index:5}
#status{font-size:14px;margin-top:6px;min-height:18px}
#status.error{color:#ffb3b3;font-weight:bold}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;padding:12px 4px;border:0;border-radius:8px;background:#ffffff33;color:#fff;font-size:15px}
nav button.active{background:#fff;color:#2c5d8f;font-weight:bold}
main{padding:14px;max-width:700px;margin:0 auto}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
label.lbl{display:block;margin:8px 0 4px;font-weight:bold}
input[type=text],input[type=number]{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #bbb;border-radius:8px}
.btn{display:block;width:100%;padding:14px;font-size:17px;border:0;border-radius:8px;background:#2c5d8f;color:#fff;margin-top:10px;text-align:center;box-sizing:border-box;cursor:pointer}
.btn.secondary{background:#6b7b8c}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.qrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.qrow span.num{width:110px;font-weight:bold}
.qrow label{margin:0;font-weight:normal;display:flex;align-items:center;gap:3px;padding:6px 8px;border:1px solid #ccc;border-radius:6px}
.msg{font-size:16px;margin-top:10px;min-height:20px;line-height:1.4}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:center}
.score{font-size:28px;font-weight:bold;text-align:center;margin:10px 0}
#preview svg{width:100%;height:auto;border:1px solid #ccc;background:#fff}
#debug{width:100%;height:auto;margin-top:12px;border:1px solid #ccc;display:none}
.legend{font-size:14px;color:#555;margin-top:6px}
footer{padding:16px;color:#555;font-size:14px;text-align:center}
</style>
<script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js"
        onerror="setStatus('No se pudo descargar OpenCV. Revisa la conexión a internet y recarga la página.', true)"></script>
</head>
<body>

<header>
  <h1 style="margin:0;font-size:20px">Exámenes tipo test</h1>
  <div id="status">Cargando OpenCV…</div>
  <nav>
    <button id="nav-create" class="active" onclick="showScreen('create')">1. Crear</button>
    <button id="nav-print" onclick="showScreen('print')">2. Imprimir</button>
    <button id="nav-grade" onclick="showScreen('grade')">3. Corregir</button>
  </nav>
</header>

<main>

  <section id="create" class="screen active">
    <div class="card">
      <label class="lbl" for="title">Título del examen</label>
      <input type="text" id="title" placeholder="Ej.: Examen Tema 3">
      <label class="lbl" for="nq">Número de preguntas (1-20)</label>
      <input type="number" id="nq" min="1" max="20" value="10">
      <button class="btn secondary" onclick="buildKeyForm()">Generar formulario de respuestas</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Respuestas correctas</h3>
      <div id="keyForm">Pulsa "Generar formulario de respuestas" para empezar.</div>
      <button class="btn" onclick="saveExam()">Guardar examen</button>
      <div id="createMsg" class="msg"></div>
    </div>
  </section>

  <section id="print" class="screen">
    <div class="card">
      <h3 style="margin-top:0">Hoja de respuestas</h3>
      <div id="printInfo" class="msg"></div>
      <button class="btn" onclick="printSheet()">Imprimir (A4)</button>
      <div id="preview" style="margin-top:12px"></div>
    </div>
  </section>

  <section id="grade" class="screen">
    <div class="card">
      <h3 style="margin-top:0">Corregir una foto</h3>
      <button class="btn" onclick="pickFile()">Elegir foto (galería, cámara o archivos)</button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
      <div id="msg" class="msg"></div>
      <div id="result"></div>
      <canvas id="debug"></canvas>
      <div id="legend" class="legend" style="display:none">Verde: burbuja marcada. Gris: burbuja no marcada.</div>
    </div>
  </section>

</main>

<footer>Created by salvador_musiccomposer</footer>

<script>
const FID = [[60,60],[940,60],[940,1340],[60,1340]];
const TOP = 300, BOT = 1240;
const COLS = [300,440,580,720];
const SW = 1000, SH = 1400;
const MARK = 0.25;
const MAX_PROC = 1600;
const bubbleR = nq => Math.min(22, ((BOT-TOP)/nq) * 0.35);
let cvReady = false;
let cvPromiseUsed = false;

function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
}

function setStatus(text, isError){
  const st = $('status');
  st.textContent = text;
  st.className = isError ? 'error' : '';
  const m = $('msg');
  m.textContent = text;
  m.style.color = isError ? '#b00' : '#222';
  m.style.fontWeight = isError ? 'bold' : 'normal';
}

/* ---------- Carga de OpenCV ---------- */

function checkCv(){
  if (cvReady) return true;
  if (window.cv && typeof cv.Mat === 'function'){
    cvReady = true;
    setStatus('OpenCV listo. Ya puedes corregir.');
  }
  return cvReady;
}

function waitForCv(){
  let tries = 0;
  const t = setInterval(() => {
    tries++;
    if (window.cv && typeof cv.Mat !== 'function' && typeof cv.then === 'function' && !cvPromiseUsed){
      cvPromiseUsed = true;
      cv.then(m => { window.cv = m; checkCv(); });
    }
    if (window.cv && typeof cv.Mat !== 'function' && !cvPromiseUsed){
      cv.onRuntimeInitialized = () => checkCv();
    }
    if (checkCv()){
      clearInterval(t);
    } else if (tries > 150){
      clearInterval(t);
      setStatus('OpenCV no se ha cargado tras 30 segundos. Revisa la conexión a internet y recarga la página.', true);
    }
  }, 200);
}

/* ---------- Almacenamiento ---------- */

function loadExam(){
  try { return JSON.parse(localStorage.getItem('examen')); } catch(e){ return null; }
}
function storeExam(ex){
  localStorage.setItem('examen', JSON.stringify(ex));
}

function showScreen(name){
  ['create','print','grade'].forEach(s => {
    $(s).classList.toggle('active', s === name);
    $('nav-' + s).classList.toggle('active', s === name);
  });
  if (name === 'print') refreshPrint();
  if (name === 'create') loadCreateForm();
  window.scrollTo(0, 0);
}

/* ---------- Pantalla 1: crear examen ---------- */

function buildKeyForm(){
  const nq = parseInt($('nq').value, 10);
  if (!(nq >= 1 && nq <= 20)) {
    $('createMsg').textContent = 'Introduce un número de preguntas entre 1 y 20.';
    return;
  }
  const old = loadExam();
  const prev = (old && old.n === nq) ? old.answers : [];
  let h = '';
  for (let i = 0; i < nq; i++){
    h += `<div class="qrow"><span class="num">Pregunta ${i+1}</span>`;
    'ABCD'.split('').forEach(L => {
      h += `<label><input type="radio" name="q${i}" value="${L}" ${prev[i] === L ? 'checked' : ''}>${L}</label>`;
    });
    h += '</div>';
  }
  $('keyForm').innerHTML = h;
  $('createMsg').textContent = '';
}

function loadCreateForm(){
  const ex = loadExam();
  if (ex){
    $('title').value = ex.title;
    $('nq').value = ex.n;
    if (!$('keyForm').querySelector('input')) buildKeyForm();
  }
}

function saveExam(){
  const nq = parseInt($('nq').value, 10);
  const title = $('title').value.trim();
  if (!title){ $('createMsg').textContent = 'Escribe un título para el examen.'; return; }
  if (!(nq >= 1 && nq <= 20)){ $('createMsg').textContent = 'El número de preguntas debe estar entre 1 y 20.'; return; }
  if (document.querySelectorAll('.qrow').length !== nq){
    $('createMsg').textContent = 'Pulsa "Generar formulario de respuestas" de nuevo.';
    return;
  }
  const answers = [];
  for (let i = 0; i < nq; i++){
    const c = document.querySelector(`input[name="q${i}"]:checked`);
    if (!c){
      $('createMsg').textContent = `Falta la respuesta correcta de la pregunta ${i+1}.`;
      return;
    }
    answers.push(c.value);
  }
  storeExam({ title, n: nq, answers });
  $('createMsg').textContent = 'Examen guardado.';
  showScreen('print');
}

/* ---------- Pantalla 2: hoja e impresión ---------- */

function sheetSVG(ex){
  const nq = ex.n, rowH = (BOT-TOP)/nq, r = bubbleR(nq);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SW} ${SH}">`;
  s += `<rect width="${SW}" height="${SH}" fill="#fff"/>`;
  FID.forEach(([x,y]) => {
    s += `<rect x="${x-25}" y="${y-25}" width="50" height="50" fill="#000"/>`;
  });
  s += `<text x="${SW/2}" y="130" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold">${esc(ex.title)}</text>`;
  s += `<text x="120" y="215" font-family="Arial" font-size="34">Nombre:</text>`;
  s += `<line x1="240" y1="222" x2="940" y2="222" stroke="#000" stroke-width="2"/>`;
  'ABCD'.split('').forEach((L, j) => {
    s += `<text x="${COLS[j]}" y="${TOP-25}" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">${L}</text>`;
  });
  const fs = Math.min(30, rowH*0.6);
  for (let i = 0; i < nq; i++){
    const y = TOP + rowH*(i+0.5);
    s += `<text x="230" y="${y + fs*0.35}" text-anchor="end" font-family="Arial" font-size="${fs}">${i+1}.</text>`;
    COLS.forEach(x => {
      s += `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#000" stroke-width="2"/>`;
    });
  }
  s += `<text x="${SW/2}" y="1300" text-anchor="middle" font-family="Arial" font-size="26">Rellene completamente el círculo con bolígrafo oscuro. Marque una sola opción.</text>`;
  s += '</svg>';
  return s;
}

function refreshPrint(){
  const ex = loadExam();
  if (!ex){
    $('printInfo').textContent = 'Todavía no hay ningún examen guardado. Ve al paso 1.';
    $('preview').innerHTML = '';
    return;
  }
  $('printInfo').textContent = `Examen: ${ex.title} (${ex.n} preguntas). Se imprimirá en A4.`;
  $('preview').innerHTML = sheetSVG(ex);
}

function printSheet(){
  const ex = loadExam();
  if (!ex){ $('printInfo').textContent = 'No hay examen guardado.'; return; }
  const w = window.open('', '_blank');
  if (!w){
    $('printInfo').textContent = 'El navegador ha bloqueado la ventana. Permite las ventanas emergentes e inténtalo de nuevo.';
    return;
  }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(ex.title)}</title><style>@page{size:A4;margin:0}html,body{margin:0;padding:0}svg{display:block;width:210mm;height:297mm}body{background:#fff}</style></head><body>${sheetSVG(ex)}</body></html>`);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 400);
}

/* ---------- Pantalla 3: corrección ---------- */

function pickFile(){
  const input = $('fileInput');
  input.value = '';
  input.click();
}

function handleFile(ev){
  const f = ev.target.files && ev.target.files[0];
  $('result').innerHTML = '';
  $('debug').style.display = 'none';
  $('legend').style.display = 'none';
  const ex = loadExam();
  if (!ex){ setStatus('Primero crea y guarda un examen en el paso 1.', true); return; }
  if (!f){ setStatus('No se ha seleccionado ninguna imagen.', true); return; }
  if (!checkCv()){
    setStatus('OpenCV todavía se está cargando. Espera unos segundos e inténtalo de nuevo.', true);
    return;
  }
  setStatus('Foto recibida. Procesando…');
  $('msg').scrollIntoView({behavior: 'smooth', block: 'center'});

  const reader = new FileReader();
  reader.onerror = () => setStatus('No se pudo leer el archivo. Prueba con otra foto.', true);
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      try { correct(img, ex); }
      catch(e){ setStatus('Error inesperado: ' + e.message, true); }
    };
    img.onerror = () => setStatus('No se pudo abrir la imagen. Prueba con otra foto (JPG o PNG).', true);
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

// Medida de relleno: compara el interior de la burbuja con el papel que la rodea.
// Devuelve un valor entre 0 (vacía) y 1 (totalmente rellena).
function bubbleFill(m, cx, cy, rIn, rRingIn, rRingOut){
  const pad = Math.ceil(rRingOut) + 2;
  const x0 = Math.max(0, cx - pad), y0 = Math.max(0, cy - pad);
  const x1 = Math.min(m.cols, cx + pad), y1 = Math.min(m.rows, cy + pad);
  const roi = m.roi(new cv.Rect(x0, y0, x1 - x0, y1 - y0));
  const pt = new cv.Point(cx - x0, cy - y0);

  const innerMask = cv.Mat.zeros(roi.rows, roi.cols, cv.CV_8UC1);
  cv.circle(innerMask, pt, Math.max(1, Math.round(rIn)), new cv.Scalar(255), -1);

  const ringMask = cv.Mat.zeros(roi.rows, roi.cols, cv.CV_8UC1);
  cv.circle(ringMask, pt, Math.round(rRingOut), new cv.Scalar(255), -1);
  cv.circle(ringMask, pt, Math.round(rRingIn), new cv.Scalar(0), -1);

  const innerMean = cv.mean(roi, innerMask)[0];
  const ringMean = cv.mean(roi, ringMask)[0];

  roi.delete(); innerMask.delete(); ringMask.delete();
  if (ringMean < 1) return 0;
  return Math.max(0, Math.min(1, (ringMean - innerMean) / ringMean));
}

function correct(img, ex){
  const sc = Math.min(1, MAX_PROC / Math.max(img.naturalWidth, img.naturalHeight));
  if (Math.max(img.naturalWidth, img.naturalHeight) < 1000){
    setStatus('La foto tiene poca resolución. Acércate más a la hoja y vuelve a intentarlo.', true);
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.naturalWidth * sc);
  canvas.height = Math.round(img.naturalHeight * sc);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  const W = canvas.width, H = canvas.height;

  const src = cv.imread(canvas);
  const gray = new cv.Mat(), bin = new cv.Mat(), hier = new cv.Mat();
  const red = new cv.Mat();
  const contours = new cv.MatVector();
  let warped = null, M = null, col = null;

  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.cvtColor(src, red, cv.COLOR_RGBA2GRAY);
    cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);
    cv.findContours(bin, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    const cands = [];
    for (let i = 0; i < contours.size(); i++){
      const c = contours.get(i);
      const r = cv.boundingRect(c);
      const area = cv.contourArea(c);
      const hull = new cv.Mat();
      cv.convexHull(c, hull);
      const harea = cv.contourArea(hull);
      hull.delete();
      const sol = harea > 0 ? area / harea : 0;
      const ar = r.width / r.height;
      const okSize = r.width >= 0.015*W && r.width <= 0.15*W &&
                     r.height >= 0.015*W && r.height <= 0.15*W;
      if (okSize && ar >= 0.75 && ar <= 1.33 && sol > 0.8){
        cands.push({ x: r.x + r.width/2, y: r.y + r.height/2 });
      }
      c.delete();
    }

    if (cands.length < 4){
      setStatus(`Solo he encontrado ${cands.length} de las 4 marcas negras de las esquinas. Asegúrate de que la hoja entera esté en la foto, con buena luz y sin sombras, y vuelve a intentarlo.`, true);
      return;
    }

    const targets = [[0,0],[W,0],[W,H],[0,H]];
    const chosen = [];
    for (const t of targets){
      let best = null, bd = Infinity;
      for (const c of cands){
        if (chosen.includes(c)) continue;
        const d = (c.x - t[0])**2 + (c.y - t[1])**2;
        if (d < bd){ bd = d; best = c; }
      }
      chosen.push(best);
    }

    const srcArr = [];
    chosen.forEach(p => srcArr.push(p.x, p.y));
    const dstArr = [];
    FID.forEach(p => dstArr.push(p[0], p[1]));
    const srcMat = cv.matFromArray(4, 1, cv.CV_32FC2, srcArr);
    const dstMat = cv.matFromArray(4, 1, cv.CV_32FC2, dstArr);
    M = cv.getPerspectiveTransform(srcMat, dstMat);
    srcMat.delete(); dstMat.delete();

    // Se endereza el canal de intensidad para detectar la tinta oscura.
    warped = new cv.Mat();
    cv.warpPerspective(red, warped, M, new cv.Size(SW, SH));

    const nq = ex.n, rowH = (BOT-TOP)/nq, r = bubbleR(nq);
    const rIn = r * 0.5, rRingIn = r * 1.5, rRingOut = r * 1.8;

    col = new cv.Mat();
    cv.cvtColor(warped, col, cv.COLOR_GRAY2RGBA);

    const marks = [];
    let score = 0;
    for (let i = 0; i < nq; i++){
      const y = Math.round(TOP + rowH*(i+0.5));
      const fills = COLS.map(x => bubbleFill(warped, x, y, rIn, rRingIn, rRingOut));
      const marked = [];
      fills.forEach((f, j) => { if (f >= MARK) marked.push(j); });

      let mark;
      if (marked.length === 0) mark = '—';
      else if (marked.length === 1) mark = 'ABCD'[marked[0]];
      else mark = 'X';

      const ok = marked.length === 1 && 'ABCD'[marked[0]] === ex.answers[i];
      if (ok) score++;
      marks.push({ mark, ok });

      COLS.forEach((x, j) => {
        const isMarked = marked.includes(j);
        const color = isMarked ? new cv.Scalar(0, 170, 0, 255) : new cv.Scalar(150, 150, 150, 255);
        cv.circle(col, new cv.Point(x, y), Math.round(r), color, isMarked ? 4 : 2);
      });
    }

    cv.imshow('debug', col);
    $('debug').style.display = 'block';
    $('legend').style.display = 'block';

    const nota = score / nq * 10;
    setStatus('Corrección terminada.');

    let h = `<div class="score">Nota: ${nota.toFixed(1)} / 10</div>`;
    h += `<p style="text-align:center">Aciertos: ${score} de ${nq}</p>`;
    h += '<table><tr><th>Nº</th><th>Marcada</th><th>Correcta</th><th>Resultado</th></tr>';
    marks.forEach((m, i) => {
      h += `<tr><td>${i+1}</td><td>${m.mark}</td><td>${ex.answers[i]}</td><td>${m.ok ? '✔' : '✘'}</td></tr>`;
    });
    h += '</table>';
    $('result').innerHTML = h;
    $('result').scrollIntoView({behavior: 'smooth'});
  } finally {
    src.delete(); gray.delete(); bin.delete(); hier.delete(); red.delete(); contours.delete();
    if (warped) warped.delete();
    if (M) M.delete();
    if (col) col.delete();
  }
}

loadCreateForm();
waitForCv();
</script>

</body>
</html>
