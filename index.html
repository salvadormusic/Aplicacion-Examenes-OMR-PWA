<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exámenes tipo test</title>
</head>
<body>
  <p id="status">Reactivando la aplicación…</p>
  <script>
    fetch('https://raw.githubusercontent.com/salvadormusic/Aplicacion-Examenes-OMR-PWA/d6e957dc506cd585186402b11efa1f59f28c94ed/index.html')
      .then(response => {
        if (!response.ok) throw new Error('No se pudo cargar la aplicación.');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.getElementById('status').textContent = 'No se pudo reactivar la aplicación. Comprueba tu conexión e inténtalo de nuevo.';
      });
  </script>
</body>
</html>
