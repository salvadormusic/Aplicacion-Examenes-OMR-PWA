<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicación temporalmente desactivada</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #222;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      max-width: 520px;
      padding: 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }
    h1 { margin-top: 0; color: #2c5d8f; }
  </style>
</head>
<body>
  <main>
    <h1>Aplicación temporalmente desactivada</h1>
    <p>Estamos realizando tareas de mantenimiento.</p>
    <p>Por favor, vuelve a intentarlo más tarde.</p>
  </main>
</body>
</html>
